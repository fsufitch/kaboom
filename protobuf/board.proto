syntax = "proto3";

package kaboomproto;

import "common.proto";
import "variant_classic.proto";
import "variant_kaboom.proto";

message Board {
  uint32 id   = 1;
  uint32 rows = 2;
  uint32 cols = 3;

  oneof detail {
    kaboomproto.classic.BoardDetail classic_detail = 4;
    kaboomproto.kaboom.BoardDetail   kaboom_detail = 5;
  }
}
