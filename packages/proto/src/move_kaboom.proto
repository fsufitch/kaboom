syntax = "proto3";

package proto;

import "board.proto";
import "move_classic.proto";

// KaboomChessMove represents a move in Kaboom chess.
// It extends ClassicChessMove with Kaboom-specific move types.
//
// Kaboom moves focus around "bumping", where instead of capturing, a piece enters
// another's square and causes it to be pushed away, potentially triggering chain reactions.
// When a piece is pushed off the board (directly or indirectly), it is captured.
message KaboomChessMove {
  oneof piece {
    Pawn   pawn   = 1;
    Rook   rook   = 2;
    Knight knight = 3;
    Bishop bishop = 4;
    Queen  queen  = 5;
    King   king   = 6;
  }

  message Pawn {
    // NOTE: Captures and en-passant are not present in Kaboom chess.
    oneof type {
      ClassicChessMove.Pawn.OneStep   one_step  = 1;
      ClassicChessMove.Pawn.TwoStep   two_step  = 2;
      Bump                            bump      = 3;
      Explode                         explode   = 4;

      // As in classic chess, promotions are handled as a separate move.
      // Exception: if a pawn ends up in the final rank due to a bump, it does NOT promote automatically.
      // On a player's turn, they may promote any pawns that started the turn in the final rank, in addition to making their normal move.
      // Any newly-promoted pawns may only move on subsequent turns.
      ClassicChessMove.Pawn.Promotion promotion = 5;
    }

    // Bump represents a pawn bumping another piece, along the same diagonal it could use to capture in classic chess.
    message Bump {
      Place from = 1;
      Place to   = 2;
    }

    // Explode is a special pawn ability in Kaboom chess.
    // The pawn explodes at its current location, capturing itself and pushing all adjacent pieces
    // a distance of 1 (including diagonals) away from the explosion center.
    message Explode {
      Place from = 1;
    }
  }

  message Knight {
    oneof type {
      ClassicChessMove.Knight.Move move          = 1;
      JumpAndBump                  jump_and_bump = 2;
    }

    // JumpAndBump represents a knight jumping to a new location and bumping any piece already there.
    // The bump may be in any direction (at the knight's discretion).
    message JumpAndBump {
      Place  from           = 1;
      Place  to             = 2;
      Vector bump_direction = 3;
    }
  }

  message Bishop {
    oneof type {
      ClassicChessMove.Bishop.Move move  = 1;
      Bump                         bump  = 2;
      Snipe                        snipe = 3;
    }

    // Bump represents a bishop bumping another piece along its movement lines.
    message Bump {
      Place from = 1;
      Place to   = 2;
    }

    // Snipe represents a bishop's special ability to "snipe" a piece from afar.
    // The bishop targets a piece anywhere along its movement lines, including over other pieces,
    // and pushes it one square further along the same line.

    message Snipe {
      Place from = 1;
      Place to   = 2;
    }
  }

  message Rook {
    oneof type {
      ClassicChessMove.Rook.Move move = 1;
      Bump                       bump = 2;
    }

    // Bump represents a rook bumping another piece along its movement lines.
    // At the rook's discretion, it may choose to double bump, pushing the target piece two squares instead of one.
    message Bump {
      Place from        = 1;
      Place to          = 2;
      bool  double_bump = 3;
    }
  }

  message Queen {
    oneof type {
      ClassicChessMove.Queen.Move move = 1;
      Bump                        bump = 2;
      Nova                        nova = 3;
    }

    // Bump represents a queen bumping another piece along its movement lines.
    message Bump {
      Place from = 1;
      Place to   = 2;
    }

    // Nova represents a queen's special ability to create a nova explosion.
    // The queen eliminates itself and all pieces along its movement lines (rows, columns, diagonals).
    message Nova {
      Place from = 1;
    }
  }

  message King {
    oneof type {
      ClassicChessMove.King.Move    move         = 1;
      Bump                          bump         = 2;
      MindControl                   mind_control = 3;
    }

    // Bump represents a king moving into an adjacent square and
    // bumping the piece already there in the same direction.
    message Bump {
      Place from = 1;
      Place to   = 2;
    }

    // MindControl represents a king's special ability to take control of an opponent's piece for one move.
    // The target piece must be within 2 squares of the king (New York distance).
    // The target piece then performs the specified KaboomChessMove. The king does not move as part of this move.
    message MindControl {
      Place           from         = 1;
      Place           target_piece = 2;
      KaboomChessMove target_move  = 3;
    }
  }
}
