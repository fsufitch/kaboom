syntax = "proto3";

package kaboomproto;

import "common.proto";
import "variant_classic.proto";
import "variant_kaboom.proto";


message Piece {
  uint32     id       = 1;
  PieceType  type     = 2;
  ChessColor color    = 3;
  Vec        pos      = 4;
  uint32     board_id = 5;

  PieceType promoted_type = 6;

  oneof detail {
    kaboomproto.classic.PieceDetail classic_detail = 7;
    kaboomproto.kaboom.PieceDetail   kaboom_detail = 8;
  }
}


enum PieceStatus {
  STATUS_UNKNOWN  = 0;
  STATUS_ON_BOARD = 1;
  STATUS_CAPTURED = 2;
  STATUS_BENCHED  = 3;
  STATUS_EXHAUSTED  = 4;
  STATUS_CHECK = 5;
}
