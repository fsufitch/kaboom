syntax = "proto3";

package proto;

import "color.proto";
import "board.proto";


// ChessPieceKind represents the different kinds of chess pieces.
enum ChessPieceKind {
  KIND_UNKNOWN = 0;
  PAWN = 1;
  KNIGHT = 2;
  BISHOP = 3;
  ROOK = 4;
  QUEEN = 5;
  KING = 6;
}

// ChessPiece represents a chess piece, including its identity, kind, color, and current place on the board.
// If the piece has been promoted, promoted_kind indicates the kind it was promoted to; otherwise, it is KIND_UNKNOWN.
message ChessPiece {
  string id = 1;
  ChessPieceKind kind = 2;
  ChessPieceKind promoted_kind = 3;
  ChessColor color = 4;
  Place place = 5;
}
