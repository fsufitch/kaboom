syntax = "proto3";

package proto;

message ChessBoard {
  string id = 1;
  int64 rows = 2;
  int64 columns = 3;
}

message Place {
  string board_id = 1;
  oneof zone {
    Vector board_position = 2;
    int64 captured_index = 3;
    int64 bench_index = 4;
  }
}

message Vector {
  int64 row = 1;
  int64 column = 2;
}
