syntax = "proto3";

package proto;

import "color.proto";
import "board.proto";


enum ChessPieceKind {
  KIND_UNKNOWN = 0;
  PAWN = 1;
  KNIGHT = 2;
  BISHOP = 3;
  ROOK = 4;
  QUEEN = 5;
  KING = 6;
}

message ChessPiece {
  string id = 1;
  ChessPieceKind kind = 2;
  ChessPieceKind promoted_kind = 3;
  ChessColor color = 4;
  Place place = 5;
}
