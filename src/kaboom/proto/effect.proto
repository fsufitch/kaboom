syntax = "proto3";

package proto;

import "board.proto";

message Effect {
  repeated StateChange state_changes = 1;
  repeated VisualHint visual_hints = 2;
  message StateChange {
    oneof type {
      NoOp no_op = 1;
      PieceMoved piece_moved = 2;
      PieceCaptured piece_captured = 3;
      PieceDeployed piece_deployed = 4;
    }
    message NoOp {}

    message PieceMoved {
      string piece_id = 1;
      Place to = 3;
    }

    message PieceCaptured {
      string piece_id = 1;
    }

    message PieceDeployed {
      string piece_id = 1;
      Place to = 2;
    }
  }

  message VisualHint {
    oneof type {
      NoOp no_op = 1;
    }
    message NoOp {}
  }
}
