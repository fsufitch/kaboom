syntax = "proto3";

package proto;

import "player.proto";
import "board.proto";
import "piece.proto";
import "turn.proto";

message GameSnapshot {
  GameProperties properties = 1;
  repeated Player players = 2;
  repeated ChessBoard boards = 3;
  repeated ChessPiece pieces = 4;
  repeated ExecutedTurn turn_history = 5;
}

message GameProperties {
  string id = 1;
  Variant variant = 2;
}


enum Variant {
  VARIANT_UNKNOWN = 0;
  CLASSIC = 1;
  KABOOM = 2;
}
