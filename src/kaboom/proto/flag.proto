syntax = "proto3";

package proto;

// Flag represents a game flag or setting, with various properties.
message Flag {
  string id = 1;

  oneof flag {
    Classic classic = 2;
  }

  // Flags specifically intended for classic rulesets.
  // It is assumed that a classic game has a single board and two players.
  // Which color/player each flag applies to can be derived from the ID of the piece/player.
  message Classic {
    oneof name {
      KingChecked    king_checked     = 1;
      KingCheckMated king_check_mated = 2;
      bool      stalemate        = 3;
      Resignation    resignation      = 4;
    }

    message KingChecked {
      string king_id = 1;
    }

    message KingCheckMated {
      string king_id = 1;
    }


    message Resignation {
      string player_id = 1;
      string reason = 2;
    }
  }
}
