syntax = "proto3";

package proto;

import "move.proto";
import "effect.proto";
import "google/protobuf/timestamp.proto";


message IntendedTurn {
  string id = 1;
  string player_id = 2;
  repeated Move moves = 3;
  google.protobuf.Timestamp intended_at = 4;
}

message ResolvedTurn {
  string id = 1;
  string player_id = 2;
  repeated Move moves = 3;
  repeated Effect effects = 4;
  google.protobuf.Timestamp intended_at = 5;
  google.protobuf.Timestamp resolved_at = 6;
}

message ExecutedTurn {
  string id = 1;
  string player_id = 2;
  repeated Move moves = 3;
  repeated Effect effects = 4;
  google.protobuf.Timestamp intended_at = 5;
  google.protobuf.Timestamp resolved_at = 6;
  google.protobuf.Timestamp executed_at = 7;
}
